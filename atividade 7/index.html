<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Simples</title>
</head>
<body>
    <h2>Formulari de Cadastro</h2>
    
    <form action="#" method="post">

        <!--Campo para Nome-->
        <p>
            <label for="nome">Nome Completo</label></p><br>
            <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>
        </p>
        <!--Campo Maior E-mail-->
        <p>
            <label
            for="email">E-mail:</label></br>
            <input type="email" id="email"
            name="email"
        placeholder="seuemail@exemplo.com"
        required>
        </p>
        <!--Campo Maior Senha-->
        <p>
            <label
            for="senha"></label></br>
            <input type="password" id="senha"
            name="senha" 
            placeholder="senha"
            required>
            
        </p>
        <!--Campo Maior Seleção(Dropdown)-->
        <p>
            <label
            for="assunto"></label></br>
            <select id="assunto"
            name="assunto">
                 <option
            value="duvida">Dúvida</option>
                <option
            value="sugestao">Sugestão</option>
                <option
            value="suporte">Suporte</option>
        </select>
        </p>
        <!--Caixa de Texto Grande -->
        <p>
          <label
          for="mensagem">Mensagem</label></br>
             <select id="mensagem"
                <option
            value="duvida">Dúvida</option>
               <option
            value="sugestao">Sugestão</option>
               <option
            value="suporte">Suporte</option>
        </select>
        </p>
        <!--Caixa de Texto Grande-->
        <p>
            <label
            for="mensagem">Mensagem</label></br>
            <textarea id="mensagem"
        name="mensagem" rows="4" cols="30"
        placeholder="Escreva sua mensagem aqui..."></textarea>

        </p>
        <!--Botão de Envio-->
        <p>
            <button
            type="submit">Enviar</button>
                   <button    
                type="reset">Limpar</button>    
        </p>
    </form>
</body>
</html>
