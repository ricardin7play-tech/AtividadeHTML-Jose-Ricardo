<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Simples</title>
</head>
<body>
    <h2>Formulari de Cadastro</h2>
    
    <form action="#" method="post">

        <!--Campo para Nome-->
        <p>
            <label for="nome">Nome Completo</label></p><br>
            <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>
        </p>
        <!--Campo Maior E-mail-->
        <p>
            <label
            for="email">E-mail:</label></br>
            <input type="email" id="email"
            name="email"
        placeholder="seuemail@exemplo.com"
        required>
        </p>
        <!--Campo Maior Senha-->
        <p>
            <label
            for="senha">Senha</label></br>
            <input type="password" id="senha"
            name="senha" 
            placeholder="digite sua senha"
            required>
            
        </p>
            <!--Campo Maior idade-->
        <p>
            <label
            for="idade">Idade</label></br>
            <input type="number" id="idade"
            name="idade"
            min="0" 
            placeholder="digite sua idade"
            required>
            
        </p>
        <!--Data de Nascimento-->
        <p>
            <label
            for="nascimento">Data de Nascimento</label></br>
            <input type="date" id="nascimento"
            name="nascimento">
        </p>
        <!--Botão de Envio-->
        <p>
            <button
            type="submit">Enviar</button>
            <button
            type="reset">Excluir</button>
        </p>
     
    </form>

</body>
</html>
